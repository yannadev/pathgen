<details class="profile-menu group relative mt-5 border-t border-slate-200 pt-4 dark:border-slate-800">
    <summary class="flex min-h-14 cursor-pointer list-none items-center gap-3 rounded-xl px-2 py-2 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-500/20 dark:hover:bg-slate-800">
        <span class="grid size-10 shrink-0 place-items-center rounded-xl bg-slate-900 text-sm font-semibold text-white dark:bg-slate-100 dark:text-slate-950">
            {{ request.user.first_name|first|upper }}{{ request.user.last_name|first|upper }}
        </span>
        <span class="min-w-0 flex-1 text-left">
            <span class="block truncate text-sm font-semibold text-slate-900 dark:text-slate-100">{{ request.user.get_full_name }}</span>
            <span class="block truncate text-xs text-slate-500 dark:text-slate-400">{{ request.user.get_role_display }}</span>
        </span>
        <i class="iconsax text-lg text-slate-500 transition-transform group-open:rotate-180 dark:text-slate-400" icon-name="chevron-up" aria-hidden="true"></i>
    </summary>
    <div class="absolute bottom-[calc(100%+0.5rem)] left-0 right-0 rounded-xl border border-slate-200 bg-white p-1.5 shadow-xl shadow-slate-950/10 dark:border-slate-700 dark:bg-slate-900">
        <span class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm text-slate-400" aria-disabled="true">
            <i class="iconsax text-lg" icon-name="user-1" aria-hidden="true"></i>
            Account settings
        </span>
        <button type="button" class="flex min-h-11 w-full items-center gap-3 rounded-lg px-3 text-left text-sm font-medium text-rose-700 hover:bg-rose-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-rose-500/15 dark:text-rose-300 dark:hover:bg-rose-950/40" data-dialog-open="logout-dialog">
            <i class="iconsax text-lg" icon-name="logout-1" aria-hidden="true"></i>
            Log out
        </button>
    </div>
</details>
