<dialog id="force-posttest-dialog" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-xl border border-amber-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-amber-900 dark:bg-slate-900 dark:text-slate-50"><form method="post" action="{{ form_action }}" class="p-5 md:p-6">{% csrf_token %}<h2 class="text-lg font-semibold tracking-tight">Grant early posttest access?</h2><p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">This student can take the posttest before completing all lessons. The override will be recorded in the audit log.</p><label class="mt-5 block text-sm font-medium">Student<select class="mt-1.5 min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm dark:border-slate-700 dark:bg-slate-900" name="student_id" required>{% for student in students %}<option value="{{ student.id }}">{{ student.get_full_name }} — {{ student.email }}</option>{% endfor %}</select></label><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 dark:text-slate-200" data-dialog-close>Cancel</button><button class="min-h-11 rounded-xl bg-amber-700 px-4 text-sm font-semibold text-white">Grant access</button></div></form></dialog>
