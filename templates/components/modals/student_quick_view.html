<dialog id="student-quick-view-{{ student.id|default:dialog_id }}" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50" aria-labelledby="student-quick-view-title-{{ student.id|default:dialog_id }}">
    <div class="p-5 md:p-6">
        <div class="mb-4 grid size-11 place-items-center rounded-xl bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-200"><i class="iconsax text-xl" icon-name="user-1" aria-hidden="true"></i></div>
        <h2 id="student-quick-view-title-{{ student.id|default:dialog_id }}" class="text-lg font-semibold tracking-tight">{{ student.get_full_name }}</h2>
        <dl class="mt-5 space-y-3 text-sm"><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Status</dt><dd class="font-medium">{{ status|default:"Not started" }}</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Current lesson</dt><dd class="text-right font-medium">{{ current_lesson|default:"—" }}</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Overall progress</dt><dd class="font-medium">{{ progress_text|default:"No progress yet" }}</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Last activity</dt><dd class="text-right font-medium">{{ last_activity|default:"No activity recorded" }}</dd></div></dl>
        <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-500/25 dark:text-slate-200 dark:hover:bg-slate-800" data-dialog-close>Close</button>{% if detail_url %}<a href="{{ detail_url }}" class="inline-flex min-h-11 items-center justify-center rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white hover:bg-cyan-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-500/25 dark:bg-cyan-400 dark:text-cyan-950">View full detail</a>{% endif %}</div>
    </div>
</dialog>
