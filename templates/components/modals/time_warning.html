<dialog id="time-warning-dialog" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-amber-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-amber-900 dark:bg-slate-900 dark:text-slate-50" aria-labelledby="time-warning-title">
    <div class="p-5 md:p-6">
        <div class="mb-4 grid size-11 place-items-center rounded-xl bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200">
            <i class="iconsax text-xl" icon-name="clock" aria-hidden="true"></i>
        </div>
        <h2 id="time-warning-title" class="text-lg font-semibold tracking-tight" data-time-warning-title>5 minutes remaining</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">Review unanswered questions and submit before the timer reaches zero.</p>
        <div class="mt-6 flex justify-end">
            <button type="button" class="min-h-11 whitespace-nowrap rounded-xl bg-amber-700 px-4 text-sm font-semibold text-white hover:bg-amber-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-amber-500/25 dark:bg-amber-400 dark:text-amber-950 dark:hover:bg-amber-300" data-dialog-close>Continue pretest</button>
        </div>
    </div>
</dialog>
