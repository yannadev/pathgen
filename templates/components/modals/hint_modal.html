<dialog id="hint-{{ dialog_id }}" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50">
    <div class="p-5 md:p-6">
        <div class="mb-4 grid size-11 place-items-center rounded-xl bg-cyan-100 text-cyan-800 dark:bg-cyan-950 dark:text-cyan-200">
            <i class="iconsax text-xl" icon-name="lamp-on" aria-hidden="true"></i>
        </div>
        <h2 class="text-lg font-semibold tracking-tight">Hint</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">{{ hint_text }}</p>
        <div class="mt-6 flex justify-end">
            <button type="button" class="min-h-11 rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white hover:bg-cyan-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-500/25 active:translate-y-px dark:bg-cyan-400 dark:text-cyan-950 dark:hover:bg-cyan-300" data-dialog-close>Continue exercise</button>
        </div>
    </div>
</dialog>
