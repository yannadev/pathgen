<dialog id="logout-dialog" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50">
    <div class="p-5 md:p-6">
        <div class="mb-4 grid size-11 place-items-center rounded-xl bg-rose-50 text-rose-700 dark:bg-rose-950/50 dark:text-rose-300">
            <i class="iconsax text-xl" icon-name="logout-1" aria-hidden="true"></i>
        </div>
        <h2 class="text-lg font-semibold tracking-tight">Log out of Pathgen?</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">Your active study session will be closed safely.</p>
        <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="min-h-11 rounded-xl border border-slate-300 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-slate-500/15 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800" data-dialog-close>Stay signed in</button>
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="min-h-11 w-full whitespace-nowrap rounded-xl bg-rose-700 px-4 text-sm font-semibold text-white hover:bg-rose-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-rose-500/20 sm:w-auto">Log out</button>
            </form>
        </div>
    </div>
</dialog>
