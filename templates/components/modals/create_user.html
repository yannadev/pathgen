<dialog id="create-user-dialog" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50" aria-labelledby="create-user-title"><form method="post" action="{{ form_action }}" class="p-5 md:p-6">{% csrf_token %}<h2 id="create-user-title" class="text-lg font-semibold tracking-tight">Create user</h2><p class="mt-2 text-sm text-slate-600 dark:text-slate-300">Only teacher and student accounts can be created here. The user must change the temporary password at first sign-in.</p><div class="mt-5 grid gap-4 sm:grid-cols-2">{% for field in form %}<div{% if field.name == "email" or field.name == "temp_password" %} class="sm:col-span-2"{% endif %}><label class="mb-1.5 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<p class="mt-1 text-xs text-rose-700">{{ field.errors|striptags }}</p>{% endif %}</div>{% endfor %}</div><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100 dark:text-slate-200" data-dialog-close>Cancel</button><button class="min-h-11 rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white hover:bg-cyan-800 dark:bg-cyan-400 dark:text-cyan-950">Create account</button></div></form></dialog>
