<dialog id="remove-student-{{ student.id|default:dialog_id }}" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-xl border border-rose-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-rose-900 dark:bg-slate-900 dark:text-slate-50"><form method="post" action="{{ form_action }}" class="p-5 md:p-6">{% csrf_token %}<h2 class="text-lg font-semibold tracking-tight">Remove {{ student.get_full_name }}?</h2><p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">This removes the class enrollment only. Student progress and research records remain preserved.</p><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 dark:text-slate-200" data-dialog-close>Cancel</button><button class="min-h-11 rounded-xl bg-rose-700 px-4 text-sm font-semibold text-white">Remove student</button></div></form></dialog>
