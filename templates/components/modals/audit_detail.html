<dialog id="audit-detail-{{ entry.id|default:dialog_id }}" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50" aria-labelledby="audit-detail-title-{{ entry.id|default:dialog_id }}"><div class="p-5 md:p-6"><p class="text-sm font-medium text-cyan-700 dark:text-cyan-300">Audit entry</p><h2 id="audit-detail-title-{{ entry.id|default:dialog_id }}" class="mt-1 text-lg font-semibold tracking-tight">{{ entry.action }}</h2><dl class="mt-5 space-y-3 text-sm"><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Admin</dt><dd class="font-medium">{{ entry.admin.get_full_name }}</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Target</dt><dd class="text-right font-medium">{{ entry.target_type }}<br><span class="break-all text-xs text-slate-500">{{ entry.target_id }}</span></dd></div><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Timestamp</dt><dd class="text-right font-medium">{{ entry.created_at|date:"M j, Y, g:i a" }}</dd></div></dl><div class="mt-5 rounded-xl bg-slate-50 p-4 dark:bg-slate-800"><h3 class="text-sm font-semibold">Details</h3><pre class="mt-2 overflow-x-auto whitespace-pre-wrap break-words text-xs leading-5 text-slate-700 dark:text-slate-200">{{ entry.details_jsonb|default:"No additional context." }}</pre></div><div class="mt-6 flex justify-end"><button type="button" class="min-h-11 rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white dark:bg-cyan-400 dark:text-cyan-950" data-dialog-close>Close</button></div></div></dialog>
