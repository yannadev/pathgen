<dialog id="edit-user-{{ user.id|default:dialog_id }}" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50" aria-labelledby="edit-user-title-{{ user.id|default:dialog_id }}"><form method="post" action="{{ form_action }}" class="p-5 md:p-6">{% csrf_token %}<h2 id="edit-user-title-{{ user.id|default:dialog_id }}" class="text-lg font-semibold tracking-tight">Edit {{ user.get_full_name }}</h2><div class="mt-5 grid gap-4 sm:grid-cols-2"><label class="block text-sm font-medium">First name<input class="mt-1.5 min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm dark:border-slate-700 dark:bg-slate-900" name="first_name" value="{{ user.first_name }}" required></label><label class="block text-sm font-medium">Last name<input class="mt-1.5 min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm dark:border-slate-700 dark:bg-slate-900" name="last_name" value="{{ user.last_name }}" required></label><label class="block text-sm font-medium sm:col-span-2">Email<input class="mt-1.5 min-h-11 w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm dark:border-slate-700 dark:bg-slate-900" type="email" name="email" value="{{ user.email }}" required></label><label class="flex min-h-11 items-center gap-3 text-sm font-medium sm:col-span-2"><input type="checkbox" name="is_active" value="true" {% if user.is_active %}checked{% endif %}> Active account</label></div><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 dark:text-slate-200" data-dialog-close>Cancel</button><button class="min-h-11 rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white dark:bg-cyan-400 dark:text-cyan-950">Save changes</button></div></form></dialog>
