<dialog id="edit-class-dialog" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50"><form method="post" action="{{ form_action }}" class="p-5 md:p-6">{% csrf_token %}<h2 class="text-lg font-semibold tracking-tight">Edit class</h2><div class="mt-5 grid gap-4">{% for field in form %}<div><label class="mb-1.5 block text-sm font-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}</div>{% endfor %}</div><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 dark:text-slate-200" data-dialog-close>Cancel</button><button class="min-h-11 rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white dark:bg-cyan-400 dark:text-cyan-950">Save class</button></div></form></dialog>
