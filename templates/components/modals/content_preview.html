<dialog id="content-preview-{{ preview_id|default:content_id }}" class="m-auto w-[calc(100%-2rem)] max-w-lg rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50" aria-labelledby="content-preview-title-{{ preview_id|default:content_id }}">
    <div class="p-5 md:p-6"><p class="text-sm font-medium text-cyan-700 dark:text-cyan-300">{{ content_type|default:"Content" }}</p><h2 id="content-preview-title-{{ preview_id|default:content_id }}" class="mt-1 text-lg font-semibold tracking-tight">{{ title }}</h2><dl class="mt-5 space-y-3 text-sm"><div class="flex justify-between gap-4"><dt class="text-slate-600 dark:text-slate-300">Order</dt><dd class="font-medium">{{ order_index|default:"—" }}</dd></div></dl><p class="mt-4 text-sm leading-6 text-slate-600 dark:text-slate-300">{{ description|default:"No description is available." }}</p><div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end"><button type="button" class="min-h-11 rounded-xl px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-500/25 dark:text-slate-200 dark:hover:bg-slate-800" data-dialog-close>Close preview</button>{% if detail_url %}<a href="{{ detail_url }}" class="inline-flex min-h-11 items-center justify-center rounded-xl bg-cyan-700 px-4 text-sm font-semibold text-white hover:bg-cyan-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-cyan-500/25 dark:bg-cyan-400 dark:text-cyan-950">Open full page</a>{% endif %}</div></div>
</dialog>
