<dialog id="activity-start-dialog-{{ dialog_id }}" class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-200 bg-white p-0 text-slate-950 shadow-2xl dark:border-slate-700 dark:bg-slate-900 dark:text-slate-50">
    <div class="p-5 md:p-6">
        <div class="mb-4 grid size-11 place-items-center rounded-xl bg-violet-100 text-violet-800 dark:bg-violet-950 dark:text-violet-200">
            <i class="iconsax text-xl" icon-name="game" aria-hidden="true"></i>
        </div>
        <h2 class="text-lg font-semibold tracking-tight">Start this activity?</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">You will answer 30 questions that bring together {{ activity.lesson_1.title }} and {{ activity.lesson_2.title }}. Your active study time is tracked while you work.</p>
        <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
            <button type="button" class="min-h-11 rounded-xl border border-slate-300 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-slate-500/15 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800" data-dialog-close>Not yet</button>
            <form method="post" action="{% url 'practice:activity_start' activity.id %}">
                {% csrf_token %}
                <button type="submit" class="min-h-11 w-full whitespace-nowrap rounded-xl bg-violet-700 px-4 text-sm font-semibold text-white hover:bg-violet-800 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-violet-500/25 sm:w-auto dark:bg-violet-400 dark:text-violet-950 dark:hover:bg-violet-300">Begin activity</button>
            </form>
        </div>
    </div>
</dialog>
